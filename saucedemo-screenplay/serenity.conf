serenity {
    take.screenshots = FOR_EACH_ACTION
    test.root = co.com.taller.saucedemo
    console.colors = true
    restart.browser.for.each = scenario
}

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      # Navegador FIJADO a proposito (Chrome for Testing 157.0.8103.40).
      # El Chrome instalado se auto-actualizo a 157.0.8103.52 y esa version descarta
      # clics sintetizados de WebDriver de forma intermitente (la suite paso de 17/17 a 5/17
      # sin cambiar ni una linea de codigo). Ver GUIA.md, seccion "Solucion de problemas".
      binary = "c:/Users/Xiomara/Desktop/taller-calidad/tools/chrome/win64-157.0.8103.40/chrome-win64/chrome.exe"
    }
  }
}

chrome.switches = "--start-maximized;--test-type;--no-sandbox;--disable-popup-blocking;--disable-infobars;--remote-allow-origins=*;--incognito"
