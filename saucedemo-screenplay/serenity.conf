serenity {
    take.screenshots = FOR_EACH_ACTION
    test.root = co.com.taller.saucedemo
    console.colors = true
    restart.browser.for.each = scenario
}

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
  }
}

chrome.switches = "--start-maximized;--test-type;--no-sandbox;--disable-popup-blocking;--disable-infobars;--remote-allow-origins=*;--incognito"
